name: Scheduled ingest

# 11:00 IST for morning filings, 18:30 IST after end-of-day data settles. Weekdays only; exchanges are shut at weekends.
on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Commit snapshot
        run: |
          git config user.name "finn-ingest[bot]"
          git config user.email "finn-ingest@users.noreply.github.com"
          git add data/snapshot
          git diff --cached --quiet || git commit -m "Update market and research snapshot"
          git push
